name: Build SM-A226B kernel

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE*'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'Optional KSU_VERSION override (defaults to ci/manager-version.txt)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel + AnyKernel3
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      KSU_VERSION_OVERRIDE: ${{ inputs.ksu_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev lz4 ccache \
            device-tree-compiler python3 zip unzip cpio rsync curl git zlib1g-dev

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ hashFiles('ci/fetch_toolchain.sh') }}

      - name: Fetch toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: bash ci/fetch_toolchain.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('ci/fetch_toolchain.sh') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ hashFiles('ci/fetch_toolchain.sh') }}-

      - name: Build kernel
        run: |
          set -o pipefail
          bash ci/build.sh 2>&1 | tee build.log

      - name: Verify warning-free build log
        run: bash ci/verify-log.sh build.log

      - name: ccache stats
        run: ccache -s | tee ccache-stats.txt

      - name: Package AnyKernel3 + PathMask
        run: |
          bash ci/package.sh
          bash pathmask/build.sh
          bash ci/verify.sh
          bash ci/verify-features.sh | tee feature-verify.txt

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: A226B-Image-${{ github.run_number }}
          path: out/arch/arm64/boot/Image.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: A226B-AnyKernel3-${{ github.run_number }}
          path: dist/A226B-SukiSU-SUSFS240-NoMount-2*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload kernel modules
        uses: actions/upload-artifact@v4
        with:
          name: A226B-Modules-${{ github.run_number }}
          path: dist/A226B-SukiSU-SUSFS240-NoMount-modules-*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload PathMask package
        uses: actions/upload-artifact@v4
        with:
          name: A226B-PathMask-${{ github.run_number }}
          path: dist/A226B-PathMask-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification logs
        uses: actions/upload-artifact@v4
        with:
          name: A226B-verify-logs-${{ github.run_number }}
          path: |
            build.log
            feature-verify.txt
            ccache-stats.txt
            ci/repro-date.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
